name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Tests gate the deploy: a regression in the app or the shipped catalog stops it.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Lint, typecheck and test the app (includes shipped-data checks)
        working-directory: app
        run: |
          npm ci
          npm run lint
          npx tsc -b
          npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: ETL unit tests + validate committed exports
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s scripts/tests -v
          python scripts/validate_exports.py

  build:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install & build
        working-directory: app
        env:
          # Project site: https://<user>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build
          # SPA deep links on project Pages (/map, /globe, /insights).
          # Custom 404.html often returns an empty body for project sites;
          # pretty URLs from *.html files return HTTP 200 without a trailing slash.
          cp dist/index.html dist/404.html
          for route in map globe insights; do
            cp dist/index.html "dist/${route}.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
